<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POPOROPO</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <style>
    /* Buscador */



  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <nav class="navbar">
      <div class="logo">POPOROPO</div>
      <ul class="menu">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="indexseries.html">Series</a></li>
        <li><a href="peliculas.html">Películas</a></li>
      </ul>
    </nav>
  </header>
  
  <!-- Buscador -->
  <div class="search-container">
    <input type="text" id="searchBar" placeholder=" Buscar películas ...">
  </div>

  <!-- Carrusel de Películas -->
  <section class="carousel">
    <h2>Ciencia ficción</h2>
    <div class="movies" id="movieList">
      <div class="movie" data-title="Back To The Future I" data-link="https://dood.work/e/ns89lnhmesrz">
        <img src="https://occ-0-56-55.1.nflxso.net/dnm/api/v6/evlCitJPPCVCry0BZlEFb5-QjKc/AAAABXYpQ7zLFS1nnNa9rHUkghqJp8rrJkiLPNbfSfuNh1k221Gy3C_fBB4vpQq8wHWQUd3_WfRV32KmaZFtCTpt4xxmOEnt.jpg?r=db2" alt="Back To The Future I">
      </div>
      <div class="movie" data-title="Back To The Future II" data-link="https://dood.work/e/vywlb7ruzy3i">
        <img src="https://occ-0-34-32.1.nflxso.net/dnm/api/v6/evlCitJPPCVCry0BZlEFb5-QjKc/AAAABXEkzIEQLmHrDxiiyB547yjrB9yUGeMxwi8aN4zDOH-7NZpXC0Wn3FhTVd7AKKwDML9egbIAn3oHbSwkyDtXguqKd-xO.jpg?r=a09" alt="Back To The Future II">
      </div>
      <div class="movie" data-title="Back To The Future III" data-link="https://dood.work/e/1dz5pc4tf8zj">
        <img src="https://occ-0-2794-2218.1.nflxso.net/dnm/api/v6/evlCitJPPCVCry0BZlEFb5-QjKc/AAAABRqAKCGDbueBxDqrB8mGN3b1MtmXwsqYKPQAqEPUw15-oDcjhEoG9Kpi0IBwZuKuKE2bZmSTLAcRNLbxliwZi5jDbIr9.jpg?r=999" alt="Back To The Future III">
      </div>
    </div>
  </section>

  <!-- Modal -->
  <div id="videoModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <iframe id="videoPlayer" src="" allowfullscreen></iframe>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p>&copy; 2024 POPOROPO. Todos los derechos reservados.</p>
  </footer>

  <script>
    const movies = document.querySelectorAll(".movie");
    const modal = document.getElementById("videoModal");
    const videoPlayer = document.getElementById("videoPlayer");
    const closeModal = document.querySelector(".close");

    movies.forEach(movie => {
      movie.addEventListener("click", () => {
        const videoLink = movie.getAttribute("data-link");
        videoPlayer.src = videoLink; // Asigna el enlace al iframe
        modal.style.display = "flex"; // Muestra el modal
      });
    });

    // Cierra el modal al hacer clic en el botón de cerrar
    closeModal.addEventListener("click", () => {
      modal.style.display = "none";
      videoPlayer.src = ""; // Detener el video
    });

    // Cierra el modal al hacer clic fuera de este
    window.addEventListener("click", (event) => {
      if (event.target === modal) {
        modal.style.display = "none";
        videoPlayer.src = ""; // Detener el video
      }
    });

    // Filtro de búsqueda
    document.getElementById("searchBar").addEventListener("input", function () {
      const searchQuery = this.value.toLowerCase();
      movies.forEach(movie => {
        const title = movie.getAttribute("data-title").toLowerCase();
        movie.style.display = title.includes(searchQuery) ? "inline-block" : "none";
      });
    });
  </script>
</body>
</html>
