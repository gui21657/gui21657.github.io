        .movie-collage {
    position: fixed;
    top: 0;
    left: -200px; /* Mueve 100px hacia la izquierda */

    height: 200%;
    display: flex;
    justify-content: space-around;
    opacity: 0.3;
    transform: rotateX(0deg) rotateZ(15deg);
}

        .movie-column {

            height: 300vh; /* Altura mayor que la pantalla */

        }

        .movie-card {
            width: 150px;

        @keyframes float-up {

            100% { transform: translateY(-100%); }
        }

        @keyframes float-down {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(50vh); }
