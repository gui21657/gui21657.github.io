<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="icon" href="android-chrome-192x192.png" type="image/x-icon"/>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="CinePoporopo.com ▶ Series GRATIS en HD: Drama, Comedia, Sci-Fi y más.">
  <meta name="keywords" content="series gratis, ver series online HD, subtítulos español">
  <meta name="author" content="CinePoporopo">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <meta property="og:type" content="website">
  <meta property="og:title" content="CinePoporopo 🎬 Series GRATIS en HD.">
  <meta property="og:description" content="¡Mira series completas en HD con subtítulos en español!">
  <meta property="og:url" content="https://www.cinepoporopo.com/series">
  <meta name="theme-color" content="#141414">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>POPOROPO · Series</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://api.themoviedb.org">
  <link rel="preconnect" href="https://image.tmdb.org">
  <link rel="dns-prefetch" href="https://vidsrc.xyz">
  <link rel="dns-prefetch" href="https://vidsrc.to">
  <link rel="dns-prefetch" href="https://embed.su">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header class="header" id="mainHeader">
    <nav class="navbar" aria-label="Navegación principal">
      <a href="index.html" class="logo">POPOROPO</a>
      <ul class="menu">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="series.html" class="active">Series</a></li>
      </ul>
    </nav>
    <div class="header-right">
      <div class="search-container">
        <label for="searchBar" class="sr-only">Buscar series</label>
        <span class="search-icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="20" y1="20" x2="16.65" y2="16.65"></line></svg>
        </span>
        <input type="text" id="searchBar" placeholder="Buscar series..." aria-label="Buscar series" autocomplete="off" inputmode="search">
        <button type="button" id="searchClear" class="search-clear" aria-label="Limpiar búsqueda" hidden>
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="6" y1="18" x2="18" y2="6"></line></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Banner Principal -->
  <section class="banner" id="mainBanner">
    <div class="banner-overlay"></div>
    <div class="banner-content" id="bannerContent" hidden>
      <h1 id="bannerTitle"></h1>
      <p class="banner-desc" id="bannerDesc"></p>
      <div class="banner-meta" id="bannerMeta"></div>
      <div class="buttons">
        <button class="btn btn-play" type="button" id="bannerPlayBtn">
          <span class="btn-icon" aria-hidden="true">▶</span> Reproducir
        </button>
        <button class="btn btn-info" type="button" id="bannerInfoBtn">
          <span class="btn-icon" aria-hidden="true">ⓘ</span> Más info
        </button>
      </div>
    </div>
    <div class="banner-fade-bottom"></div>
  </section>

  <!-- Catálogo de series -->
  <main class="content-area" id="catalog" aria-live="polite"></main>

  <!-- Resultados de búsqueda -->
  <main class="search-results-area" id="searchResults" hidden>
    <div class="section-header">
      <h2 class="section-title"><span class="title-accent" aria-hidden="true">|</span> Resultados de búsqueda</h2>
    </div>
    <div class="search-grid" id="searchGrid"></div>
  </main>

  <!-- Footer -->
  <footer>
    <p class="footer-logo">POPOROPO</p>
    <p class="footer-copy">&copy; 2025 CinePoporopo · Series gratis en HD · Datos provistos por TMDB</p>
  </footer>

  <!-- Modal de Video -->
  <div id="videoModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="videoModalTitle" aria-hidden="true">
    <div class="modal-backdrop"></div>
    <div class="modal-content" role="document">
      <h2 id="videoModalTitle" class="sr-only">Reproductor de video</h2>
      <button type="button" class="close" id="closeModal" aria-label="Cerrar reproductor">×</button>
      <div class="player-wrapper">
        <div class="player-spinner" id="playerSpinner" aria-hidden="true">
          <div class="spinner-ring"></div>
          <p>Cargando…</p>
        </div>
        <iframe
          id="videoPlayer"
          src=""
          title="Reproductor de video"
          allowfullscreen
          allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
          loading="lazy">
        </iframe>
        <div id="adClickBlocker" aria-hidden="true">
          <div class="blocker-strip blocker-top"></div>
          <div class="blocker-strip blocker-bottom"></div>
        </div>
      </div>
      <div class="server-buttons" id="serverButtonsContainer">
        <!-- Se llena dinámicamente -->
      </div>
    </div>
  </div>

  <!-- Modal Informativo -->
  <div id="infoModal" class="modal info-modal" role="dialog" aria-modal="true" aria-labelledby="infoModalTitle" aria-hidden="true">
    <div class="modal-backdrop"></div>
    <div class="modal-content info-modal-content" role="document">
      <button type="button" class="close" id="closeInfoModal" aria-label="Cerrar información">×</button>
      <div class="info-backdrop" id="infoBackdrop"></div>
      <div class="info-body">
        <h2 id="infoModalTitle" class="info-title"></h2>
        <div class="info-meta">
          <span class="badge badge-hd">HD</span>
          <span class="info-year"></span>
          <span class="info-duration"></span>
          <span class="info-genre"></span>
          <span class="info-rating"></span>
        </div>
        <p class="info-desc"></p>
        <div class="info-actions">
          <button type="button" class="btn btn-play" id="infoPlayBtn">
            <span class="btn-icon" aria-hidden="true">▶</span> Reproducir
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Mensaje de búsqueda vacía -->
  <div id="searchEmpty" class="search-empty" role="status" aria-live="polite" hidden>
    <p>No se encontraron resultados para "<span id="searchTerm"></span>"</p>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="series.js" defer></script>
</body>
</html>
