          episodioDiv.classList.add('episodio');
          // Añadir la miniatura como vista previa
          episodioDiv.innerHTML = `
            <div class="video-container">
              <img src="${episodio.preview}" class="video-preview" data-link="${episodio.enlace}" alt="Vista previa de ${episodio.titulo}">
              <a href="#" class="play-video" data-link="${episodio.enlace}">${episodio.titulo}</a>
            </div>
          `;
          temporadaDiv.appendChild(episodioDiv);
        });

        episodiosList.appendChild(temporadaDiv);
      });
    } else {
      serieTituloElement.innerText = "Serie no encontrada";
    }

    // Mostrar el modal cuando se haga clic en una miniatura de video o en un episodio
    document.addEventListener('click', function (event) {
      if (event.target.classList.contains('play-video') || event.target.classList.contains('video-preview')) {
        event.preventDefault();
        const videoLink = event.target.getAttribute('data-link');
        if (videoLink) {
          videoPlayer.src = videoLink; // Cargar el video en el iframe
          modal.style.display = "block"; // Mostrar el modal
        }
      }
    });

    // Cerrar el modal cuando se haga clic en la "X"
    closeModal.onclick = function () {
      modal.style.display = "none";
      videoPlayer.src = ""; // Detener el video
    };

    // Cerrar el modal cuando se haga clic fuera de este
    window.onclick = function (event) {
      if (event.target === modal) {
        modal.style.display = "none";
        videoPlayer.src = ""; // Detener el video
      }
    };
  </script>

  <!-- Footer -->

</body>
</html>
